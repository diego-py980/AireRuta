<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0056ac">
  <meta name="description" content="AireRuta: prototipo académico interactivo para comparar rutas urbanas según tiempo, distancia y exposición ambiental estimada.">
  <title>AireRuta | Planifica tu recorrido</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-7v-7h-4v7H3z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.7 8.3-2.4 5-5 2.4 2.4-5z"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M5 3h14v18l-7-5-7 5z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 .8 5M3 3v7h7M12 7v5l4 3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M2 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M2 16h8a3 3 0 1 1-3 3"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C10 4 4 8 4 15a5 5 0 0 0 5 5C16 20 20 14 20 3ZM5 19c4-5 7-8 12-11"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="17" r="4"/><circle cx="18.5" cy="17" r="4"/><path d="m5.5 17 5-9 4 9h-9l5-9h4M14.5 8h4"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="m11 9 3-2 3 5m-3-5-2 5-4 4m4-4 3 5-1 5M8 16l-4 5"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="18" rx="3"/><path d="M5 12h14M8 20v2m8-2v2M8 6h8"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="m5 16-1 3h3l1-2h8l1 2h3l-1-3-2-8H7l-2 8ZM5 13h14M8 8l1-3h6l1 3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#fff"/><circle cx="15" cy="17" r="2" fill="#fff"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 4h6M6 7l1 14h10l1-14M10 11v7m4-7v7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-graduation" viewBox="0 0 24 24"><path d="m2 10 10-6 10 6-10 6zM6 13v5c4 3 8 3 12 0v-5M22 10v7"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M9 7V4h6v3M3 13h18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20V4M3 20h18M7 15l4-5 4 3 5-7"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="brand-wrap"><button type="button" class="mobile-close icon-button" data-action="close-menu" aria-label="Cerrar menú"><svg class="ico"><use href="#i-close"/></svg></button><img src="assets/logo.svg" alt="AireRuta" width="168" height="50"></div>
      <nav class="side-menu" aria-label="Secciones">
        <button class="nav-item" data-view="inicio"><svg class="ico"><use href="#i-home"/></svg> Inicio</button>
        <button class="nav-item" data-view="buscar"><svg class="ico"><use href="#i-search"/></svg> Buscar ruta</button>
        <button class="nav-item" data-view="explorar"><svg class="ico"><use href="#i-compass"/></svg> Explorar</button>
        <button class="nav-item" data-view="guardadas"><svg class="ico"><use href="#i-bookmark"/></svg> Rutas guardadas</button>
        <button class="nav-item" data-view="historial"><svg class="ico"><use href="#i-history"/></svg> Historial</button>
        <button class="nav-item" data-view="alertas"><svg class="ico"><use href="#i-bell"/></svg> Alertas</button>
        <button class="nav-item" data-view="perfil"><svg class="ico"><use href="#i-user"/></svg> Perfil</button>
        <button class="nav-item" data-view="aire"><svg class="ico"><use href="#i-wind"/></svg> Información ambiental</button>
      </nav>
      <button type="button" class="sidebar-account" data-view="perfil"><span class="account-avatar"><svg class="ico"><use href="#i-user"/></svg></span><span><strong class="account-name">Nombre usuario</strong><small>Ver perfil</small></span></button>
    </aside>
    <div class="mobile-shade" data-action="close-menu"></div>
    <div class="main-column">
      <header class="mobile-header"><button type="button" class="icon-button" data-action="open-menu" aria-label="Abrir menú"><svg class="ico"><use href="#i-menu"/></svg></button><img src="assets/logo.svg" alt="AireRuta" width="132" height="37"><button type="button" class="icon-button" data-view="alertas" aria-label="Ver alertas"><svg class="ico"><use href="#i-bell"/></svg></button></header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Navegación móvil"><button data-view="inicio"><svg class="ico"><use href="#i-home"/></svg><span>Inicio</span></button><button data-view="explorar"><svg class="ico"><use href="#i-compass"/></svg><span>Explorar</span></button><button data-view="historial"><svg class="ico"><use href="#i-history"/></svg><span>Historial</span></button><button data-view="guardadas"><svg class="ico"><use href="#i-bookmark"/></svg><span>Guardadas</span></button><button data-view="perfil"><svg class="ico"><use href="#i-user"/></svg><span>Perfil</span></button></nav>
  <div id="notice" role="status" aria-live="polite"></div>
  <script defer src="js/main.js"></script>
</body>
</html>
